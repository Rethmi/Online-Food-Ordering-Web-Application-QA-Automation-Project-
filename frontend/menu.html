<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu - Foodie</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <nav>
        <a href="index.html" class="logo">Foodie</a>
        <div class="nav-links" id="nav-right"></div>
        <button id="theme-toggle">🌓</button>
    </nav>

    <header style="padding: 2rem 10%;">
        <h1>Our Menu</h1>
        <p>Explore our delicious range of fresh meals.</p>
    </header>

    <div class="product-grid" id="menu-grid">
        <!-- Products will be loaded here -->
    </div>

    <script src="script.js"></script>
    <script>
        const products = [
            { id: 1, name: 'Cheese Burger', price: 12.99, image: 'https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=400' },
            { id: 2, name: 'Margherita Pizza', price: 15.50, image: 'https://images.unsplash.com/photo-1604382354936-07c5d9983bd3?auto=format&fit=crop&w=400' },
            { id: 3, name: 'Chicken Pasta', price: 14.00, image: 'https://images.unsplash.com/photo-1473093226795-af9932fe5856?auto=format&fit=crop&w=400' },
            { id: 4, name: 'Garden Salad', price: 9.99, image: 'https://images.unsplash.com/photo-1512621776951-a57141f2eefd?auto=format&fit=crop&w=400' },
            { id: 5, name: 'Sushi Platter', price: 22.00, image: 'https://images.unsplash.com/photo-1579871494447-9811cf80d66c?auto=format&fit=crop&w=400' },
            { id: 6, name: 'Chocolate Cake', price: 7.50, image: 'https://images.unsplash.com/photo-1578985545062-69928b1d9587?auto=format&fit=crop&w=400' }
        ];

        function renderMenu() {
            const grid = document.getElementById('menu-grid');
            grid.innerHTML = products.map(p => `
                <div class="glass product-card">
                    <img src="${p.image}" alt="${p.name}">
                    <h3>${p.name}</h3>
                    <p style="color: var(--primary-color); font-weight: 700; margin: 0.5rem 0;">$${p.price.toFixed(2)}</p>
                    <button class="btn btn-outline" onclick="addToCart({id: ${p.id}, name: '${p.name}', price: ${p.price}})">Add to Cart</button>
                </div>
            `).join('');
        }

        renderMenu();
    </script>
</body>
</html>
