<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Foodie</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <nav>
        <a href="index.html" class="logo">Foodie</a>
        <div class="nav-links" id="nav-right"></div>
        <button id="theme-toggle">🌓</button>
    </nav>

    <div class="glass form-container">
        <h2 style="text-align: center; margin-bottom: 2rem;">Create Account</h2>
        <form id="register-form">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" placeholder="John Doe">
                <div id="name-error" class="error-message">Name is required</div>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="john@example.com">
                <div id="email-error" class="error-message">Enter a valid email</div>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••">
                <div id="password-error" class="error-message">Password must be at least 6 characters</div>
            </div>
            <div class="form-group">
                <label for="confirm-password">Confirm Password</label>
                <input type="password" id="confirm-password" placeholder="••••••••">
                <div id="confirm-error" class="error-message">Passwords do not match</div>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%;">Register</button>
            <p style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem;">
                Already have an account? <a href="login.html" style="color: var(--primary-color);">Login</a>
            </p>
        </form>
    </div>

    <script src="script.js"></script>
    <script>
        document.getElementById('register-form').addEventListener('submit', (e) => {
            e.preventDefault();
            
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirm-password').value;
            
            let isValid = true;

            // Simple validations
            if (!name) { 
                document.getElementById('name-error').style.display = 'block'; 
                isValid = false; 
            } else { document.getElementById('name-error').style.display = 'none'; }

            if (!email.includes('@')) { 
                document.getElementById('email-error').style.display = 'block'; 
                isValid = false; 
            } else { document.getElementById('email-error').style.display = 'none'; }

            if (password.length < 6) { 
                document.getElementById('password-error').style.display = 'block'; 
                isValid = false; 
            } else { document.getElementById('password-error').style.display = 'none'; }

            if (password !== confirm) { 
                document.getElementById('confirm-error').style.display = 'block'; 
                isValid = false; 
            } else { document.getElementById('confirm-error').style.display = 'none'; }

            if (isValid) {
                const users = JSON.parse(localStorage.getItem('users')) || [];
                if (users.find(u => u.email === email)) {
                    alert('Email already registered!');
                    return;
                }
                users.push({ name, email, password });
                localStorage.setItem('users', JSON.stringify(users));
                alert('Registration successful! please login.');
                window.location.href = 'login.html';
            }
        });
    </script>
</body>
</html>
