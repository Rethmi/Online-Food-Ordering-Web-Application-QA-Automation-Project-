<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Foodie</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <nav>
        <a href="index.html" class="logo">Foodie</a>
        <div class="nav-links" id="nav-right"></div>
        <button id="theme-toggle">🌓</button>
    </nav>

    <div class="glass form-container" style="max-width: 600px;">
        <h2>Checkout Details</h2>
        <form id="checkout-form" style="margin-top: 1.5rem;">
            <div class="form-group">
                <label for="address">Delivery Address</label>
                <input type="text" id="address" placeholder="123 Main St, City">
            </div>
            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="text" id="phone" placeholder="+1 234 567 890">
            </div>
            <div class="form-group">
                <label for="card">Card Number (Simulation)</label>
                <input type="text" id="card" placeholder="xxxx xxxx xxxx xxxx">
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%;">Complete Order</button>
        </form>
        <div id="order-success" style="display: none; text-align: center;">
            <h1 style="color: #2ed573;">✔ Order Successful!</h1>
            <p>Your food is on the way. Order ID: #FD-${Math.floor(Math.random()*10000)}</p>
            <a href="menu.html" class="btn btn-primary" style="margin-top: 1.5rem;">Back to Menu</a>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        document.getElementById('checkout-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const addr = document.getElementById('address').value;
            const phone = document.getElementById('phone').value;
            const card = document.getElementById('card').value;

            if (!addr || !phone || !card) {
                alert('Please fill in all checkout fields.');
                return;
            }

            // Clear cart
            localStorage.setItem('cart', JSON.stringify([]));
            
            document.getElementById('checkout-form').style.display = 'none';
            document.getElementById('order-success').style.display = 'block';
        });
    </script>
</body>
</html>
