<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart - Foodie</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <nav>
        <a href="index.html" class="logo">Foodie</a>
        <div class="nav-links" id="nav-right"></div>
        <button id="theme-toggle">🌓</button>
    </nav>

    <div class="glass cart-items">
        <h2 style="margin-bottom: 2rem;">Your Shopping Cart</h2>
        <div id="cart-list">
            <!-- Items loading here -->
        </div>
        <div id="cart-empty" style="text-align: center; display: none;">
            <p>Your cart is empty.</p>
            <a href="menu.html" class="btn btn-primary" style="margin-top: 1rem;">View Menu</a>
        </div>
        <div id="cart-summary" style="margin-top: 2rem; border-top: 2px solid var(--glass-border); padding-top: 1rem;">
            <div style="display: flex; justify-content: space-between; font-size: 1.2rem; font-weight: 700;">
                <span>Total:</span>
                <span id="cart-total">$0.00</span>
            </div>
            <a href="checkout.html" id="checkout-btn" class="btn btn-primary" style="width: 100%; margin-top: 1.5rem; text-align: center;">Proceed to Checkout</a>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        function loadCartItems() {
            const list = document.getElementById('cart-list');
            const summary = document.getElementById('cart-summary');
            const empty = document.getElementById('cart-empty');
            
            if (cart.length === 0) {
                list.style.display = 'none';
                summary.style.display = 'none';
                empty.style.display = 'block';
                return;
            }

            list.style.display = 'block';
            summary.style.display = 'block';
            empty.style.display = 'none';

            list.innerHTML = cart.map((item, index) => `
                <div class="cart-item">
                    <div>
                        <h3>${item.name}</h3>
                        <p>$${item.price.toFixed(2)}</p>
                    </div>
                    <button class="btn btn-outline" style="border-color: #ff3848; color: #ff3848;" onclick="removeFromCart(${index})">Remove</button>
                </div>
            `).join('');

            const total = cart.reduce((sum, item) => sum + item.price, 0);
            document.getElementById('cart-total').innerText = `$${total.toFixed(2)}`;
        }

        document.addEventListener('DOMContentLoaded', loadCartItems);
    </script>
</body>
</html>
